name: Android Build
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      task:
        description: Gradle task
        default: assembleDebug
      gradle:
        description: Gradle version
        default: '9.8.2'
      jdk:
        description: JDK version
        default: '21'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Decrypt source (only when src.tar.gz.gpg exists)
        env:
          SOURCE_PASSPHRASE: ${{ secrets.SOURCE_PASSPHRASE }}
        run: |
          if [ -f src.tar.gz.gpg ]; then
            [ -n "$SOURCE_PASSPHRASE" ] || { echo 'Secret SOURCE_PASSPHRASE is missing'; exit 1; }
            printf '%s' "$SOURCE_PASSPHRASE" > "$RUNNER_TEMP/sp"
            gpg --batch --yes --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/sp" -o src.tar.gz -d src.tar.gz.gpg
            tar -xzf src.tar.gz
            shred -u src.tar.gz "$RUNNER_TEMP/sp" 2>/dev/null || rm -f src.tar.gz "$RUNNER_TEMP/sp"
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ github.event.inputs.jdk || '21' }}
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ github.event.inputs.gradle || '9.8.2' }}
      - uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1
      - name: Build the exec helper (libexec_hook.so, libcloudexec.so) with the NDK
        # Lets programs started by pack programs (cargo -> rustc, npm -> node, python -> subprocess) run at targetSdk 29+.
        # Output goes to app/src/main/jniLibs/arm64-v8a, so Gradle packs it as lib*.so (useLegacyPackaging = true).
        run: |
          bash native/test/host_test.sh
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
            yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" >/dev/null
            NDK="$sdk/ndk/27.2.12479018"
          fi
          NDK="$NDK" bash native/build.sh
          file app/src/main/jniLibs/arm64-v8a/libexec_hook.so app/src/main/jniLibs/arm64-v8a/libcloudexec.so
          readelf -d app/src/main/jniLibs/arm64-v8a/libexec_hook.so | grep -E 'NEEDED|SONAME'
      - name: Toolchain patch tests (Runtime.Version and java.lang.management stand-ins)
        run: |
          sh toolchain/test/patch_test.sh
          sh toolchain/test/platform_test.sh
      - name: Unit tests (resolver, manifest merge, AI assistant)
        # Advisory: a failing test shows up here as a warning but never stops the APK from being built.
        continue-on-error: true
        run: sh toolchain/test/run.sh
      - name: Bundle the compiler jars into the APK (assets/toolchain)
        # ecj, d8, apksig and android.jar ship inside CloudIDE so local builds work without any download.
        # Skipped when the four jars are already committed. The native SDK tools are in app/src/main/jniLibs.
        run: bash toolchain/bundle-jars.sh
      - name: Build
        env:
          TASK: ${{ github.event.inputs.task }}
        run: |
          [ -z "$TASK" ] && TASK=assembleDebug
          if [ -f ./gradlew ]; then chmod +x ./gradlew; ./gradlew --no-daemon $TASK; else gradle --no-daemon $TASK; fi
      - name: Name the APK
        run: |
          apk=$(find . -path '*/build/outputs/apk/*' -name '*.apk' | head -1)
          [ -n "$apk" ] || { echo 'No APK was built'; exit 1; }
          cp "$apk" CloudIDE.apk
      - name: Encrypt the APK (only when secret APK_PASSPHRASE is set)
        env:
          APK_PASSPHRASE: ${{ secrets.APK_PASSPHRASE }}
        run: |
          if [ -n "$APK_PASSPHRASE" ]; then
            printf '%s' "$APK_PASSPHRASE" > "$RUNNER_TEMP/ap"
            gpg --batch --yes --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/ap" --symmetric --cipher-algo AES256 -o CloudIDE.apk.gpg CloudIDE.apk
            shred -u CloudIDE.apk "$RUNNER_TEMP/ap" 2>/dev/null || rm -f CloudIDE.apk "$RUNNER_TEMP/ap"
          fi
      - uses: actions/upload-artifact@v7
        with:
          path: |
            CloudIDE.apk*
          if-no-files-found: error
          retention-days: 1
      - name: Wipe decrypted source from the runner
        if: always()
        run: find . -maxdepth 1 -mindepth 1 ! -name '.git' -exec rm -rf {} +
