plugins { id 'com.android.application' }
android {
    namespace = '__PKG__'
    compileSdk = 37
    defaultConfig {
        applicationId = '__PKG__'
        minSdk = 26
        targetSdk = 37
        versionCode = 1
        versionName = '1.0'
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
// No dependencies on purpose: this template builds on the phone (Local build) and on GitHub.
// Drop .jar / .aar files into app/libs to use libraries locally.
dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
}
