# cloudide:rust
name: Android and Rust Build
on:
  workflow_dispatch:
    inputs:
      task:
        description: Gradle task
        default: assembleDebug
      gradle:
        description: Gradle version
        default: '9.8.2'
      jdk:
        description: JDK version
        default: '21'
      artifact:
        description: Output files pattern
        default: ''
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Decrypt source (only when src.zip.enc exists)
        env:
          SOURCE_PASSPHRASE: ${{ secrets.SOURCE_PASSPHRASE }}
        run: |
          if [ -f src.zip.enc ]; then
            [ -n "$SOURCE_PASSPHRASE" ] || { echo 'Secret SOURCE_PASSPHRASE is missing'; exit 1; }
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:SOURCE_PASSPHRASE -in src.zip.enc -out src.zip
            unzip -qo src.zip
            shred -u src.zip 2>/dev/null || rm -f src.zip
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ github.event.inputs.jdk || '21' }}
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ github.event.inputs.gradle || '9.8.2' }}
      - uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1
      - uses: actions/cache@v6
        id: ndkcache
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-v1
      - name: Rust toolchain for Android
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          if [ ! -x "$HOME/.cargo/bin/cargo-ndk" ]; then cargo install cargo-ndk --locked; fi
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}" >> "$GITHUB_ENV"
      - name: Build
        env:
          TASK: ${{ github.event.inputs.task }}
        run: |
          [ -z "$TASK" ] && TASK=assembleDebug
          if [ -f ./gradlew ]; then chmod +x ./gradlew; ./gradlew --no-daemon $TASK; else gradle --no-daemon $TASK; fi
      - name: Encrypt outputs (only when secret OUTPUT_PASSPHRASE is set)
        env:
          OUTPUT_PASSPHRASE: ${{ secrets.OUTPUT_PASSPHRASE }}
        run: |
          [ -n "$OUTPUT_PASSPHRASE" ] || exit 0
          find . -type f \( -path '*/build/outputs/*' -o -path './build/app/outputs/flutter-apk/*' -o -path './cloudide-out/*' -o -path './dist/*' \) \
            ! -name '*.enc' ! -name '*.txt' -print0 | while IFS= read -r -d '' f; do
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:OUTPUT_PASSPHRASE -in "$f" -out "$f.enc" && rm -f "$f"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: output
          path: |
            ${{ github.event.inputs.artifact || '**/build/outputs/apk/**/*.apk' }}
            **/*.enc
            !src.zip.enc
          if-no-files-found: warn
          retention-days: 1
